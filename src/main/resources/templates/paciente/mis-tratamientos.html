<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis Tratamientos')}"></head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col lg:flex-row">

<aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>

<div class="flex-1 flex flex-col min-w-0">
    <header th:replace="~{fragments/header :: header(${breadcrumb}, 'Mi Plan de Hoy', '/paciente/mi-plan')}"></header>

    <main class="p-6 max-w-5xl w-full mx-auto space-y-6">
        <div th:if="${#lists.isEmpty(medicamentos)}" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center text-sm text-slate-500">
            No tienes tratamientos activos registrados actualmente.
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <article th:each="med : ${medicamentos}"
                     class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-4">
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <h2 class="text-lg font-display font-bold" th:text="${med.nombre}">Medicamento</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400" th:text="${med.principioActivo} ?: 'Principio activo no especificado'"></p>
                    </div>
                    <span th:if="${med.esAltoRiesgo}" class="text-xs font-semibold text-red-700 dark:text-red-400">Alto riesgo</span>
                </div>

                <div class="grid grid-cols-3 gap-3 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-800 text-xs">
                    <div>
                        <p class="text-slate-500 dark:text-slate-400">Dosis</p>
                        <p class="font-mono-tabular font-semibold mt-0.5" th:text="${med.dosisFormateada}">50 mg</p>
                    </div>
                    <div>
                        <p class="text-slate-500 dark:text-slate-400">Vía</p>
                        <p class="font-semibold mt-0.5" th:text="${med.viaAdministracion.etiqueta}">Oral</p>
                    </div>
                    <div>
                        <p class="text-slate-500 dark:text-slate-400">Frecuencia</p>
                        <p class="font-mono-tabular font-semibold mt-0.5" th:text="'Cada ' + ${med.frecuenciaHoras} + ' h'">12 h</p>
                    </div>
                </div>

                <p class="text-sm text-slate-600 dark:text-slate-300" th:text="${med.instrucciones} ?: 'Seguir indicaciones médicas habituales.'"></p>
            </article>
        </div>
    </main>
</div>

</body>
</html>
