<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar(activeMenu)"
       class="w-full lg:w-64 lg:min-h-screen shrink-0 bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between">
    <div>
        <!-- Marca -->
        <div class="px-5 py-5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-teal-700 dark:bg-teal-600 text-white flex items-center justify-center shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/>
                </svg>
            </div>
            <div>
                <p class="font-display font-bold text-slate-900 dark:text-slate-100 leading-tight">RememberMe</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">Cuidado Clínico Seguro</p>
            </div>
        </div>

        <!-- Ficha de usuario autenticado -->
        <div class="p-4 border-b border-slate-200 dark:border-slate-800" sec:authorize="isAuthenticated()">
            <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-800">
                <img th:if="${#authentication.principal.avatarUrl != null}"
                     th:src="@{${#authentication.principal.avatarUrl}}"
                     th:alt="${#authentication.principal.nombre}"
                     class="w-10 h-10 rounded-xl object-cover border border-slate-200 dark:border-slate-700 shrink-0">
                <div th:if="${#authentication.principal.avatarUrl == null}"
                     class="w-10 h-10 rounded-xl bg-teal-50 text-teal-800 dark:bg-teal-950/70 dark:text-teal-200 flex items-center justify-center font-display font-bold text-sm shrink-0"
                     th:text="${#authentication.principal.iniciales}">RM</div>
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-slate-900 dark:text-slate-100 truncate"
                       th:text="${#authentication.principal.nombre}">Usuario</p>
                    <p class="text-xs text-teal-700 dark:text-teal-400 font-medium"
                       th:text="${#authentication.principal.rol.etiqueta}">Rol</p>
                </div>
            </div>
        </div>

        <!-- Navegación dinámica según rol -->
        <nav class="p-3 space-y-1">
            <!-- ROL CUIDADOR -->
            <div sec:authorize="hasAuthority('ROL_CUIDADOR')" class="space-y-1">
                <a th:href="@{/cuidador/panel}"
                   th:classappend="${activeMenu == 'panel'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span>Panel de Turno</span>
                </a>
                <a th:href="@{/cuidador/pacientes}"
                   th:classappend="${activeMenu == 'pacientes'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    <span>Pacientes y Fórmulas</span>
                </a>
                <a th:href="@{/cuidador/autocuidado}"
                   th:classappend="${activeMenu == 'autocuidado'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                    <span>Mi Autocuidado</span>
                </a>
            </div>

            <!-- ROL PACIENTE -->
            <div sec:authorize="hasAuthority('ROL_PACIENTE')" class="space-y-1">
                <a th:href="@{/paciente/mi-plan}"
                   th:classappend="${activeMenu == 'mi-plan'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    <span>Mi Plan de Hoy</span>
                </a>
                <a th:href="@{/paciente/mis-tratamientos}"
                   th:classappend="${activeMenu == 'mis-tratamientos'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                    <span>Mis Tratamientos</span>
                </a>
                <a th:href="@{/paciente/mi-perfil}"
                   th:classappend="${activeMenu == 'mi-perfil'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span>Mi Perfil Clínico</span>
                </a>
            </div>

            <!-- ROL ADMIN -->
            <div sec:authorize="hasAuthority('ROL_ADMIN')" class="space-y-1">
                <a th:href="@{/admin/resumen}"
                   th:classappend="${activeMenu == 'admin-resumen'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    <span>Resumen Global</span>
                </a>
                <a th:href="@{/admin/asignaciones}"
                   th:classappend="${activeMenu == 'admin-asignaciones'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                    </svg>
                    <span>Asignaciones</span>
                </a>
            </div>

            <!-- Módulo común: Guías Clínicas -->
            <div class="pt-2 mt-2 border-t border-slate-200 dark:border-slate-800">
                <a th:href="@{/guias}"
                   th:classappend="${activeMenu == 'guias'} ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span>Guías Clínicas</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Pie del Sidebar: Inicio y Salir -->
    <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
        <a th:href="@{/}"
           class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            <span>Inicio</span>
        </a>
        <form th:action="@{/auth/logout}" method="post" class="flex-1">
            <button type="submit"
                    class="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-950/40 hover:bg-red-100 dark:hover:bg-red-950/60 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span>Salir</span>
            </button>
        </form>
    </div>
</aside>
</body>
</html>
