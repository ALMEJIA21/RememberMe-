<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header(breadcrumb, ctaTexto, ctaHref)"
        class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div>
        <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
            <span>RememberMe</span>
            <span>·</span>
            <span class="text-teal-700 dark:text-teal-400 font-medium" th:text="${breadcrumb}">Panel</span>
        </div>
        <h1 class="text-xl font-display font-bold text-slate-900 dark:text-slate-100 mt-0.5"
            th:text="${breadcrumb}">Panel</h1>
    </div>

    <div class="flex items-center gap-3">
        <!-- Botón Claro/Oscuro -->
        <button type="button" onclick="toggleRememberMeTheme()"
                class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <svg data-theme-icon="sun" class="w-4 h-4 hidden text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg data-theme-icon="moon" class="w-4 h-4 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <span data-theme-label>Modo Oscuro</span>
        </button>

        <!-- CTA principal contextual -->
        <a th:if="${ctaTexto != null and ctaHref != null}"
           th:href="@{${ctaHref}}"
           class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 dark:bg-teal-600 dark:hover:bg-teal-500 text-white text-sm font-semibold transition">
            <span th:text="${ctaTexto}">Acción</span>
        </a>
    </div>
</header>
</body>
</html>
