<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Asignaciones Cuidador–Paciente')}"></head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col lg:flex-row">

<aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>

<div class="flex-1 flex flex-col min-w-0">
    <header th:replace="~{fragments/header :: header(${breadcrumb}, 'Volver al Resumen', '/admin/resumen')}"></header>

    <main class="p-6 max-w-6xl w-full mx-auto space-y-6">
        <div th:if="${exito}" class="p-4 rounded-2xl border border-emerald-200 dark:border-emerald-900/60 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-400 text-sm" th:text="${exito}"></div>
        <div th:if="${error}" class="p-4 rounded-2xl border border-red-200 dark:border-red-900/60 bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-400 text-sm" th:text="${error}"></div>

        <!-- Formulario nueva asignación -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6">
            <h2 class="text-lg font-display font-bold">Vincular Cuidador a Paciente</h2>
            <form th:action="@{/admin/asignaciones}" th:object="${asignacionDto}" method="post"
                  class="mt-4 grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <div class="md:col-span-4">
                    <label class="block text-xs font-medium mb-1">Cuidador</label>
                    <select th:field="*{cuidadorId}" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
                        <option value="">Selecciona un cuidador...</option>
                        <option th:each="c : ${cuidadores}" th:value="${c.id}" th:text="${c.nombre} + ' (' + ${c.correo} + ')'"></option>
                    </select>
                </div>

                <div class="md:col-span-4">
                    <label class="block text-xs font-medium mb-1">Paciente activo</label>
                    <select th:field="*{pacienteId}" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
                        <option value="">Selecciona un paciente...</option>
                        <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nombreCompleto}"></option>
                    </select>
                </div>

                <div class="md:col-span-2 pb-2.5">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input th:field="*{esPrincipal}" type="checkbox" class="rounded text-teal-700">
                        <span>Principal</span>
                    </label>
                </div>

                <div class="md:col-span-2">
                    <button type="submit"
                            class="w-full px-4 py-2.5 rounded-xl bg-teal-700 hover:bg-teal-800 dark:bg-teal-600 text-white text-sm font-semibold transition">
                        Vincular
                    </button>
                </div>
            </form>
        </section>

        <!-- Tabla de vínculos -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">
                <h3 class="text-base font-display font-bold">Asignaciones Vigentes (`cuidador_paciente`)</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-800/70 text-xs text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                    <tr>
                        <th class="px-5 py-3">Cuidador</th>
                        <th class="px-5 py-3">Paciente</th>
                        <th class="px-5 py-3">Rol en el Turno</th>
                        <th class="px-5 py-3">Asignado</th>
                        <th class="px-5 py-3 text-right">Acciones</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
                    <tr th:each="a : ${asignaciones}">
                        <td class="px-5 py-3.5 font-medium" th:text="${a.cuidador.nombre}"></td>
                        <td class="px-5 py-3.5" th:text="${a.paciente.nombreCompleto}"></td>
                        <td class="px-5 py-3.5">
                            <span th:if="${a.esPrincipal}" class="text-xs font-semibold text-teal-700 dark:text-teal-400">Cuidador Principal</span>
                            <span th:if="${!a.esPrincipal}" class="text-xs font-medium text-slate-600 dark:text-slate-300">Cuidador de Apoyo</span>
                        </td>
                        <td class="px-5 py-3.5 font-mono-tabular text-xs text-slate-500"
                            th:text="${#temporals.format(a.asignadoEn, 'yyyy-MM-dd')}"></td>
                        <td class="px-5 py-3.5 text-right">
                            <div class="inline-flex items-center gap-3">
                                <form th:action="@{/admin/asignaciones/tipo}" method="post">
                                    <input type="hidden" name="cuidadorId" th:value="${a.id.cuidadorId}">
                                    <input type="hidden" name="pacienteId" th:value="${a.id.pacienteId}">
                                    <input type="hidden" name="esPrincipal" th:value="${!a.esPrincipal}">
                                    <button type="submit" class="text-xs font-medium text-teal-700 dark:text-teal-400 hover:underline"
                                            th:text="${a.esPrincipal} ? 'Cambiar a Apoyo' : 'Hacer Principal'"></button>
                                </form>
                                <span class="text-slate-300 dark:text-slate-700">·</span>
                                <form th:action="@{/admin/asignaciones/revocar}" method="post"
                                      onsubmit="return confirm('¿Revocar este vínculo cuidador-paciente?');">
                                    <input type="hidden" name="cuidadorId" th:value="${a.id.cuidadorId}">
                                    <input type="hidden" name="pacienteId" th:value="${a.id.pacienteId}">
                                    <button type="submit" class="text-xs font-medium text-red-700 dark:text-red-400 hover:underline">Revocar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

</body>
</html>
